<!-- Floating Action Button -->
<button class="chat-toggle-btn" (click)="toggleChat()" *ngIf="!isOpen">
  💬 Ask AI
</button>

<!-- Chat Window -->
<div class="chat-window" *ngIf="isOpen">
  <div class="chat-header">
    <div class="header-title">
      🎓 ScholarWorld Assistant
    </div>
    <button class="close-btn" (click)="toggleChat()">✖</button>
  </div>

  <div class="chat-messages">
    <div *ngFor="let msg of messages"
         [ngClass]="{'message-user': msg.sender === 'user', 'message-bot': msg.sender === 'bot'}">
      {{ msg.text }}
    </div>

    <div *ngIf="isLoading" class="message-bot typing-indicator">
      Thinking...
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text"
           [(ngModel)]="userInput"
           (keyup.enter)="sendMessage()"
           placeholder="Type a message..." />
    <button (click)="sendMessage()" [disabled]="isLoading || !userInput.trim()">Send</button>
  </div>
</div>
