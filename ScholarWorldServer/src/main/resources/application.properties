spring.application.name=ScholarWorld

# --- CLOUD RUN PORT CONFLICT ---
# Cloud Run dynamically assigns a port. Hardcoding 8000 causes the "Container failed to start" timeout.
# server.port=8000

spring.jpa.hibernate.ddl-auto=update

# --- MYSQL DATABASE (Local vs Cloud) ---
# These point to your laptop (127.0.0.1). Spring Boot was trying to find your local database in the cloud!
# We comment these out here, and pass the real Cloud SQL URL through the deployment variables instead.
# spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ScholarWorldCommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- H2 IN-MEMORY DATABASE (Optional local dev) ---
# Uncomment these lines only if you intentionally want a fresh in-memory DB on every run.
# spring.datasource.url=jdbc:h2:mem:scholarworlddb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=password
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- THE BUGGY HIBERNATE LOGGERS ---
# THESE CAUSED THE FATAL CRASH! The DomainResultGraphPrinter bug trips over these being turned on.
# spring.jpa.show-sql= true
# logging.level.org.hibernate= trace

# Setting this back to INFO so your cloud logs aren't overwhelmed
logging.level.org.springframework.web= info

security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
# 1h in millisecond
security.jwt.expiration-time=3600000

#Vertex AI Gemini Configuration
spring.ai.vertex.ai.gemini.project-id = scholarworld
spring.ai.vertex.ai.gemini.location = us-central1
spring.ai.vertex.ai.gemini.chat.options.model=gemini-2.5-flash

# Optional Enable logging to see the tool-calling JSON in your console
# logging.level.org.springframework.ai = DEBUG

