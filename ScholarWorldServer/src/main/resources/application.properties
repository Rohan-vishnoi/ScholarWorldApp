spring.application.name=ScholarWorld
server.port=8000
spring.jpa.hibernate.ddl-auto=update

# --- MYSQL DATABASE (Persistent) ---
# Uses your existing MySQL schema/data instead of creating a new in-memory DB each run.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ScholarWorldCommerce?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- H2 IN-MEMORY DATABASE (Optional local dev) ---
